# ============================================================================
# WAGO CODESYS Project Generator - Configuration File
# ============================================================================
# Author: Alexander Fugmann
# Description: Central configuration for batch launcher
# ============================================================================

[CODESYS]
# CODESYS Installation Path (without quotes)
InstallPath=C:\Program Files\CODESYS 3.5.21.10\CODESYS\Common
ExecutableName=Codesys.exe
Profile=CODESYS V3.5 SP21 Patch 1

[PATHS]
# Directories - Local Development
BasePath=D:\WAGO\CODESYS\scripting\project generator\files
ScriptDirectory=D:\WAGO\CODESYS\scripting\project generator
LogDirectory=D:\WAGO\CODESYS\scripting\project generator\files\logs
ProjectDirectory=D:\WAGO\CODESYS\scripting\project generator\files\projects
OutputDirectory=D:\WAGO\CODESYS\scripting\project generator\files\outputs
ExportDirectory=D:\WAGO\CODESYS\scripting\project generator\files\exports

[SCRIPTS]
# Available Python Scripts
Script1=codesys_project_generator_local.py
Script1_Name=CODESYS Project Generator (Local)

Script2=standalone_xml_import.py
Script2_Name=Standalone XML Import

# Default script (used when no selection is made)
DefaultScript=codesys_project_generator_local.py

[XML_IMPORT]
# XML Import Configuration
EnableXMLImport=1
DefaultConflictResolve=replace
ImportFolderStructure=1
ValidateXMLFormat=1

[OPTIONS]
# Behavior
AutoPauseOnError=1
ShowDetailedLogs=1
MaxLogLines=20
AutoOpenLogOnError=0

[COLORS]
# Color scheme (0=off, 1=on)
UseColors=1

[FEATURES]
# Feature Flags
UseLibraryRepositories=1
EnableFunctionBlocks=1
EnableXMLImport=1
EnableTemplateMode=1

# ============================================================================
# NOTES:
# ============================================================================
# 
# - Paths with spaces WITHOUT quotes
# - Relative paths calculated from script directory
# - Boolean values: 1=enabled, 0=disabled
# - After changes save file and restart batch
# - XML imports require PLCopenXML or Project XML format
# - .export files are NOT supported (convert to PLCopenXML first)
#
# ============================================================================
